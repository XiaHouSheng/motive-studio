appId: com.motive.studio
productName: Motive Studio
directories:
  output: release
  buildResources: build
asar: true
files:
  - main/**
  - "!main/server-entry.mjs"
  - package.json
extraResources:
  - from: dist/server.mjs
    to: server.mjs
  - from: dist/server.mjs.map
    to: server.mjs.map
  - from: main/server-entry.mjs
    to: server-entry.mjs
  - from: ../web/dist
    to: web
  # 内嵌 frpc（服务广播）：把 frpc.exe 放入 resources/bin 即随包分发；
  # 缺省时远程访问面板会提示程序不可用，也可放到 userData/bin 由用户自行放置
  - from: resources/bin
    to: bin
win:
  target:
    - target: nsis
    - target: portable
  icon: build/icon.ico
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  deleteAppDataOnUninstall: false
